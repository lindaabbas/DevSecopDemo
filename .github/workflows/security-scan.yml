name: DevSecOps Hybrid Security Scan

on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install torch transformers scikit-learn pandas numpy bandit --quiet

      - name: Download trained models
        run: |
          gh release download models-v1 --repo ${{ github.repository }} --dir .
          unzip -o models.zip -d .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run security scan
        run: python scan_changed_files.py
        env:
          GATE_ON: 'Hybrid Ensemble'
          REPORT_ONLY: '0'

      - name: Measure H3 pipeline timing
        if: always()
        run: python measure_h3_pipeline.py

      - name: Upload H3 timing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3-timing-results
          path: results/h3_ttd_pipeline_overhead.json

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: scan_results.json
